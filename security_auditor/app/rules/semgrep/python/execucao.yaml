# Execução dinâmica de código, ofuscação e execução de comandos.
# Campos em metadata são lidos pelo auditor para montar o relatório.
rules:
  - id: auditor.py.ofuscacao-decodifica-e-executa
    languages: [python]
    severity: ERROR
    message: Código decodificado/descompactado e depois executado
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: base64.$DEC(...)
          - pattern: binascii.$DEC(...)
          - pattern: zlib.decompress(...)
          - pattern: lzma.decompress(...)
          - pattern: bz2.decompress(...)
          - pattern: gzip.decompress(...)
          - pattern: marshal.loads(...)
          - pattern: codecs.decode(...)
          - pattern: bytes.fromhex(...)
          - pattern: $X[::-1]
    pattern-sinks:
      - pattern-either:
          - pattern: exec(...)
          - pattern: eval(...)
          - pattern: compile(...)
          - pattern: types.FunctionType(...)
          - pattern: __import__(...)
    metadata:
      titulo: Código ofuscado sendo executado
      categoria: ofuscacao
      severidade: critica
      explicacao: >-
        O código decodifica ou descompacta dados (base64, zlib, marshal, hex...) e
        executa o resultado. Integrações legítimas quase nunca fazem isso: é a
        técnica típica para esconder código malicioso da revisão humana e de
        ferramentas de análise.
      recomendacao: >-
        Decodifique o conteúdo num ambiente isolado (sem executar) e leia o que
        ele faz. Até lá, considere desativar a integração.
      titulo_en: "Obfuscated code being executed"
      explicacao_en: "The code decodes or decompresses data (base64, zlib, marshal, hex...) and executes the result. Legitimate integrations almost never do this: it is the typical technique to hide malicious code from human review and analysis tools."
      recomendacao_en: "Decode the content in an isolated environment (without running it) and read what it does. Until then, consider disabling the integration."

  - id: auditor.py.marshal-loads
    languages: [python]
    severity: WARNING
    message: marshal.loads carrega bytecode Python
    pattern: marshal.loads(...)
    metadata:
      titulo: Carregamento de bytecode com marshal
      categoria: ofuscacao
      severidade: alta
      explicacao: >-
        marshal.loads transforma bytes em objetos de código Python. É usado para
        distribuir código já compilado, que não pode ser lido no arquivo-fonte.
      recomendacao: Descubra de onde vêm os bytes e o que o código carregado faz.
      titulo_en: "Bytecode loaded with marshal"
      explicacao_en: "marshal.loads turns bytes into Python code objects. It is used to ship precompiled code that cannot be read in the source file."
      recomendacao_en: "Find out where the bytes come from and what the loaded code does."

  - id: auditor.py.builtins-indireto
    languages: [python]
    severity: WARNING
    message: Acesso indireto a funções internas
    pattern-either:
      - pattern: getattr(__builtins__, ...)
      - pattern: getattr(builtins, ...)
      - pattern: __builtins__.__dict__[...]
      - pattern: globals()["__builtins__"]
      - pattern: vars(__builtins__)[...]
    metadata:
      titulo: Acesso indireto a funções internas (builtins)
      categoria: ofuscacao
      severidade: alta
      explicacao: >-
        Buscar funções internas pelo nome (ex.: getattr(__builtins__, "ev"+"al"))
        é uma forma de chamar eval/exec sem que o nome apareça no código.
      recomendacao: Verifique qual função está sendo obtida e com quais dados ela é chamada.
      titulo_en: "Indirect access to built-in functions"
      explicacao_en: "Looking up built-in functions by name (e.g. getattr(__builtins__, \"ev\"+\"al\")) is a way to call eval/exec without the name appearing in the code."
      recomendacao_en: "Check which function is obtained and with what data it is called."

  - id: auditor.py.blob-codificado
    languages: [python]
    severity: INFO
    message: String longa codificada
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: '^[A-Za-z0-9+/=_-]{400,}$'
    metadata:
      titulo: Bloco longo de dados codificados
      categoria: ofuscacao
      severidade: media
      explicacao: >-
        Uma string longa em base64/hex embutida no código pode ser um ícone ou um
        certificado, mas também pode esconder código.
      recomendacao: Decodifique a string (sem executar) e confirme do que se trata.
      titulo_en: "Long block of encoded data"
      explicacao_en: "A long base64/hex string embedded in the code may be an icon or a certificate, but it may also hide code."
      recomendacao_en: "Decode the string (without running it) and confirm what it is."

  - id: auditor.py.eval-dinamico
    languages: [python]
    severity: WARNING
    message: eval/exec/compile com dados dinâmicos
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
          - pattern: compile($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)
      - pattern-not: compile("...", ...)
      - pattern-not: $F(<... base64.$D(...) ...>, ...)
      - pattern-not: $F(<... zlib.decompress(...) ...>, ...)
      - pattern-not: $F(<... marshal.loads(...) ...>, ...)
    metadata:
      titulo: Execução dinâmica de código (eval/exec/compile)
      categoria: execucao_dinamica
      severidade: alta
      explicacao: >-
        eval, exec e compile executam texto como código Python. Se esse texto vier
        de fora (rede, arquivo, configuração), quem controla a origem controla a
        sua instalação.
      recomendacao: >-
        Confira de onde vem o argumento. Se for de uma fonte externa, trate como
        execução remota de código.
      titulo_en: "Dynamic code execution (eval/exec/compile)"
      explicacao_en: "eval, exec and compile run text as Python code. If that text comes from outside (network, file, configuration), whoever controls the source controls your installation."
      recomendacao_en: "Check where the argument comes from. If it is an external source, treat it as remote code execution."

  - id: auditor.py.execucao-de-comandos
    languages: [python]
    severity: WARNING
    message: Execução de comandos do sistema
    pattern-either:
      - pattern: subprocess.$F(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - patterns:
          - pattern: os.$SPAWN(...)
          - metavariable-regex:
              metavariable: $SPAWN
              regex: ^(spawn\w*|exec[lv]\w*|posix_spawn\w*)$
      - pattern: asyncio.create_subprocess_exec(...)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: pty.spawn(...)
    metadata:
      titulo: Execução de comandos do sistema
      categoria: execucao_de_comandos
      severidade: media
      explicacao: >-
        A integração executa programas do sistema. Algumas precisam disso (ping,
        ffmpeg), mas é também o caminho para baixar e rodar ferramentas, abrir
        shells reversos ou alterar o sistema.
      recomendacao: Leia quais comandos são executados e com quais argumentos.
      titulo_en: "System command execution"
      explicacao_en: "The integration runs system programs. Some need this (ping, ffmpeg), but it is also the way to download and run tools, open reverse shells or change the system."
      recomendacao_en: "Read which commands are run and with which arguments."

  - id: auditor.py.shell-true
    languages: [python]
    severity: ERROR
    message: Comando executado via shell
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: asyncio.create_subprocess_shell(...)
    metadata:
      titulo: Comando executado via shell
      categoria: execucao_de_comandos
      severidade: alta
      explicacao: >-
        Executar pelo shell permite encadear comandos (;, |, &&) e, se parte do
        texto vier de fora, injetar comandos arbitrários.
      recomendacao: Verifique a montagem do comando; prefira lista de argumentos sem shell.
      titulo_en: "Command executed through a shell"
      explicacao_en: "Running through the shell allows chaining commands (;, |, &&) and, if part of the text comes from outside, injecting arbitrary commands."
      recomendacao_en: "Check how the command is built; prefer an argument list without a shell."

  - id: auditor.py.shell-reverso
    languages: [python]
    severity: ERROR
    message: Padrão de shell reverso
    pattern-either:
      - pattern: os.dup2($S.fileno(), ...)
      - pattern: pty.spawn("/bin/sh", ...)
      - pattern: pty.spawn("/bin/bash", ...)
    metadata:
      titulo: Padrão de shell reverso
      categoria: execucao_de_comandos
      severidade: critica
      explicacao: >-
        Redirecionar a entrada/saída de um socket para um shell é a assinatura de
        um shell reverso: dá a alguém de fora um terminal na sua instalação.
      recomendacao: Desative a integração imediatamente e investigue a origem do código.
      titulo_en: "Reverse shell pattern"
      explicacao_en: "Redirecting a socket's input/output to a shell is the signature of a reverse shell: it gives an outsider a terminal on your installation."
      recomendacao_en: "Disable the integration immediately and investigate where the code came from."
