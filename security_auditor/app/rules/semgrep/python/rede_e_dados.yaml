# Destinos de rede fixos, acesso a arquivos sensíveis e download+execução.
rules:
  - id: auditor.py.download-e-execucao
    languages: [python]
    severity: ERROR
    message: Conteúdo baixado da rede é executado
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: requests.$M(...)
          - pattern: httpx.$M(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: urlopen(...)
          - pattern: await $R.text(...)
          - pattern: await $R.read(...)
          - pattern: await $R.json(...)
    pattern-sinks:
      - pattern-either:
          - pattern: exec(...)
          - pattern: eval(...)
          - pattern: compile(...)
          - pattern: marshal.loads(...)
          - pattern: pickle.loads(...)
          - pattern: subprocess.$F(...)
          - pattern: os.system(...)
          - pattern: $SPEC.loader.exec_module(...)
    metadata:
      titulo: Código baixado da internet e executado
      categoria: download_execucao
      severidade: critica
      explicacao: >-
        Dados recebidos pela rede chegam a uma função que executa código ou
        comandos. Isso permite que o código real da integração seja trocado a
        qualquer momento pelo servidor remoto, sem passar por nenhuma revisão; a
        análise estática não consegue ver o que será executado.
      recomendacao: >-
        Identifique a URL de origem e o conteúdo servido. Trate como execução
        remota de código até prova em contrário.
      titulo_en: "Code downloaded from the internet and executed"
      explicacao_en: "Data received over the network reaches a function that runs code or commands. This lets the remote server swap the integration's real code at any time without any review; static analysis cannot see what will be executed."
      recomendacao_en: "Identify the source URL and the content it serves. Treat it as remote code execution until proven otherwise."

  - id: auditor.py.carregamento-dinamico-de-modulo
    languages: [python]
    severity: WARNING
    message: Carregamento de módulo a partir de arquivo/caminho dinâmico
    pattern-either:
      - pattern: importlib.util.spec_from_file_location(...)
      - pattern: importlib.machinery.SourceFileLoader(...)
      - pattern: imp.load_source(...)
      - pattern: sys.path.insert(...)
    metadata:
      titulo: Carregamento dinâmico de módulo
      categoria: download_execucao
      severidade: media
      explicacao: >-
        Carregar módulos de caminhos arbitrários permite executar código que não
        está no pacote da integração (por exemplo, um arquivo baixado depois).
      recomendacao: Verifique qual arquivo é carregado e de onde ele vem.
      titulo_en: "Dynamic module loading"
      explicacao_en: "Loading modules from arbitrary paths allows running code that is not in the integration's package (for example, a file downloaded later)."
      recomendacao_en: "Check which file is loaded and where it comes from."

  - id: auditor.py.instalacao-de-pacote-em-tempo-de-execucao
    languages: [python]
    severity: WARNING
    message: Instalação de pacote em tempo de execução
    pattern-either:
      - pattern: pip.main(...)
      - pattern: subprocess.$F([..., "pip", ...], ...)
      - pattern: subprocess.$F([..., "install", ...], ...)
      - pattern: subprocess.$F("=~/pip\s+install/", ...)
      - pattern: os.system("=~/pip\s+install/")
    metadata:
      titulo: Instalação de pacotes em tempo de execução
      categoria: download_execucao
      severidade: alta
      explicacao: >-
        A integração instala pacotes por conta própria, fora do mecanismo de
        requirements do manifest.json. Esses pacotes não aparecem no manifest e
        não passam pela auditoria de dependências.
      recomendacao: Confira quais pacotes e de qual índice/URL são instalados.
      titulo_en: "Package installation at runtime"
      explicacao_en: "The integration installs packages on its own, outside the manifest.json requirements mechanism. These packages do not appear in the manifest and are not covered by the dependency audit."
      recomendacao_en: "Check which packages are installed and from which index/URL."

  - id: auditor.py.destino-suspeito
    languages: [python]
    severity: ERROR
    message: URL de serviço usado para exfiltração ou hospedagem de payloads
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: (?i).*((?<![\w-])(pastebin\.com|paste\.ee|hastebin|ghostbin|transfer\.sh|ngrok(-free)?\.(io|app|dev)|webhook\.site|requestbin|pipedream\.net|interact\.sh|oast\.(fun|me|pro|live|site|online)|burpcollaborator|anonfiles|file\.io)(?![\w-])|(?<![\w-])(discord(app)?\.com/api/webhooks|api\.telegram\.org/bot|cdn\.discordapp\.com/attachments)|\.onion\b)
    metadata:
      titulo: Destino de rede suspeito
      categoria: destino_suspeito
      severidade: alta
      explicacao: >-
        O código referencia um serviço frequentemente usado para enviar dados
        roubados (webhooks, bots, túneis) ou para hospedar código baixado depois
        (pastebins, anexos do Discord).
      recomendacao: Veja o que é enviado ou baixado desse endereço e por quê.
      titulo_en: "Suspicious network destination"
      explicacao_en: "The code references a service often used to send stolen data (webhooks, bots, tunnels) or to host code downloaded later (pastebins, Discord attachments)."
      recomendacao_en: "Check what is sent to or downloaded from this address and why."

  - id: auditor.py.conteudo-github
    languages: [python]
    severity: INFO
    message: Baixa conteúdo de arquivos "raw" do GitHub
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: (?i).*(raw\.githubusercontent\.com|gist\.githubusercontent\.com)
    metadata:
      titulo: Baixa arquivos do GitHub (raw ou gist)
      categoria: rede
      severidade: info
      explicacao: >-
        O código aponta para arquivos "raw" do GitHub ou para um gist. É comum para
        baixar listas, traduções ou dados de dispositivos; também é um jeito de
        buscar código que não está no componente, por isso vale saber o que é baixado.
      recomendacao: Veja se o arquivo baixado é dado (JSON, YAML) ou código executado.
      titulo_en: "Downloads files from GitHub (raw or gist)"
      explicacao_en: "The code points to GitHub \"raw\" files or a gist. It is common for downloading lists, translations or device data; it is also a way to fetch code that is not in the component, so it is worth knowing what is downloaded."
      recomendacao_en: "Check whether the downloaded file is data (JSON, YAML) or code that gets run."

  - id: auditor.py.ip-fixo-publico
    languages: [python]
    severity: WARNING
    message: Endereço IP público fixo no código
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: (?:.*?(?:[^\w./-]|://))?(?!(?:10|127|0)\.)(?!192\.168\.)(?!192\.0\.2\.)(?!198\.51\.100\.)(?!203\.0\.113\.)(?!172\.(?:1[6-9]|2\d|3[01])\.)(?!169\.254\.)(?!2(?:2[4-9]|[3-5]\d)\.)(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)(?![\d.])
    metadata:
      titulo: IP público fixo no código
      categoria: url_ip_fixo
      severidade: media
      explicacao: >-
        Um IP público fixo costuma indicar um servidor controlado pelo autor
        (sem DNS, mais difícil de rastrear). Pode ser um DNS público ou um
        dispositivo do fabricante, mas merece verificação.
      recomendacao: Descubra a quem pertence o IP e o que a integração troca com ele.
      titulo_en: "Hard-coded public IP in the code"
      explicacao_en: "A hard-coded public IP usually points to a server controlled by the author (no DNS, harder to trace). It may be a public DNS or a vendor device, but it deserves a check."
      recomendacao_en: "Find out who owns the IP and what the integration exchanges with it."

  - id: auditor.py.url-fixa
    languages: [python]
    severity: INFO
    message: URL fixa no código
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: ^(?i)(https?|wss?|ftp)://[^\s"']+
      - pattern-not-inside: |
          _LOGGER.$F(...)
    metadata:
      titulo: URL fixa no código
      categoria: url_ip_fixo
      severidade: informativa
      explicacao: >-
        Lista os endereços com que a integração conversa. Normalmente é a API do
        fabricante; serve para conferir se os destinos fazem sentido para o que a
        integração diz fazer.
      recomendacao: Confira se o domínio pertence ao serviço que a integração controla.
      titulo_en: "Hard-coded URL in the code"
      explicacao_en: "Lists the addresses the integration talks to. Usually it is the vendor's API; use it to check whether the destinations make sense for what the integration claims to do."
      recomendacao_en: "Check that the domain belongs to the service the integration controls."

  - id: auditor.py.acesso-secrets-yaml
    languages: [python]
    severity: ERROR
    message: Referência direta ao secrets.yaml
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          # Só o nome ou caminho do arquivo; um texto que só menciona o arquivo (docstring, mensagem) não conta.
          regex: (?i)^(.*[/\\])?secrets\.ya?ml$
      # Listas que protegem o arquivo (não apagar, não ler, não mostrar) não são leitura.
      - pattern-not-regex: (?i)\b\w*(protect|deny|denied|block|forbid|exclu|ignor|skip|hidden|hide|sensitive|blacklist|never|readonly|read_only)\w*\s*(:[^=\n]*)?=\s*(frozenset|set|tuple|list)?\s*\(?\s*[\[\{\(][^\]\}\)]*secrets\.ya?ml["']
    metadata:
      titulo: Leitura direta do secrets.yaml
      categoria: acesso_sensivel
      severidade: alta
      explicacao: >-
        O Home Assistant já entrega à integração os valores que ela precisa. Ler
        o secrets.yaml diretamente dá acesso a TODAS as senhas e tokens da
        instalação, não só aos da integração.
      recomendacao: Verifique o que é lido e para onde esses dados vão.
      titulo_en: "Direct read of secrets.yaml"
      explicacao_en: "Home Assistant already gives the integration the values it needs. Reading secrets.yaml directly gives access to ALL passwords and tokens of the installation, not only the integration's."
      recomendacao_en: "Check what is read and where that data goes."

  - id: auditor.py.acesso-storage-auth
    languages: [python]
    severity: ERROR
    message: Referência aos arquivos de autenticação do HA
    pattern-either:
      - patterns:
          - pattern: '"$S"'
          - metavariable-regex:
              metavariable: $S
              regex: (?i).*\.storage[/\\](auth|onboarding|core\.config_entries)
      - pattern: os.path.join(..., ".storage", "=~/^(auth|onboarding|core\.config_entries)/", ...)
      - pattern: $H.config.path(".storage", "=~/^(auth|onboarding|core\.config_entries)/", ...)
      - pattern: $P / ".storage" / "=~/^(auth|onboarding|core\.config_entries)/"
    metadata:
      titulo: Acesso a arquivos de autenticação ou credenciais (.storage)
      categoria: acesso_sensivel
      severidade: critica
      explicacao: >-
        Os arquivos .storage/auth* guardam usuários, hashes de senha e tokens de
        atualização, e o .storage/core.config_entries guarda as credenciais de
        todas as outras integrações. Com eles é possível entrar na instalação ou
        nas contas ligadas a ela. Nenhuma integração comum precisa lê-los.
      recomendacao: Desative a integração e investigue; considere revogar os tokens de acesso.
      titulo_en: "Access to authentication or credential files (.storage)"
      explicacao_en: "The .storage/auth* files hold users, password hashes and refresh tokens, and .storage/core.config_entries holds the credentials of every other integration. With them it is possible to log in to the installation or to the accounts linked to it. No regular integration needs to read them."
      recomendacao_en: "Disable the integration and investigate; consider revoking the access tokens."

  - id: auditor.py.acesso-storage
    languages: [python]
    severity: WARNING
    message: Referência à pasta .storage
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: (?i)(.*[/\\])?\.storage([/\\]|$)
    metadata:
      titulo: Referência à pasta .storage
      categoria: acesso_sensivel
      severidade: baixa
      explicacao: >-
        O código usa a pasta .storage. É normal quando a integração guarda os
        próprios dados lá (um arquivo com o nome dela); os arquivos de
        autenticação e de credenciais têm regra própria, de nível crítico.
      recomendacao: Veja se o arquivo acessado é da própria integração.
      titulo_en: "Reference to the .storage folder"
      explicacao_en: "The code uses the .storage folder. It is normal when the integration keeps its own data there (a file named after it); the authentication and credential files have their own rule, at critical level."
      recomendacao_en: "Check whether the file accessed belongs to the integration itself."

  - id: auditor.py.tokens-de-acesso
    languages: [python]
    severity: WARNING
    message: Criação de tokens/usuários do HA ou acesso ao armazenamento de autenticação
    pattern-either:
      - pattern: $H.auth.async_create_refresh_token(...)
      - pattern: $H.auth.async_create_access_token(...)
      - pattern: $H.auth.async_create_user(...)
      - pattern: $H.auth.async_create_system_user(...)
      - pattern: $H.auth._store
    metadata:
      titulo: Criação de usuários ou tokens de acesso
      categoria: acesso_sensivel
      severidade: media
      explicacao: >-
        A integração cria usuários ou tokens de acesso ao Home Assistant. Algumas
        fazem isso para expor uma API, mas um token criado em segredo dá acesso
        total à instalação a quem o receber.
      recomendacao: Confirme para que o token é criado e se ele sai da instalação.
      titulo_en: "Creation of users or access tokens"
      explicacao_en: "The integration creates Home Assistant users or access tokens. Some do this to expose an API, but a token created in secret gives full access to the installation to whoever receives it."
      recomendacao_en: "Confirm what the token is created for and whether it leaves the installation."

  - id: auditor.py.lista-usuarios
    languages: [python]
    severity: INFO
    message: Leitura da lista de usuários do HA
    pattern: $H.auth.async_get_users(...)
    metadata:
      titulo: Leitura da lista de usuários
      categoria: acesso_sensivel
      severidade: info
      explicacao: >-
        A integração lê a lista de usuários do Home Assistant. Costuma ser para
        mostrar nomes ou conferir permissões; sozinha, não dá acesso a tokens.
        Criar usuários ou tokens tem regra própria.
      recomendacao: Veja o que a integração faz com os dados dos usuários.
      titulo_en: "Reading the list of users"
      explicacao_en: "The integration reads the Home Assistant user list. It is usually to show names or check permissions; on its own it gives no access to tokens. Creating users or tokens has its own rule."
      recomendacao_en: "Check what the integration does with the users' data."
