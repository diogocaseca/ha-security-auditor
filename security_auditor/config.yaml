name: HA Security Auditor
version: "0.4.1"
slug: security_auditor
description: >-
  Audita integrações customizadas (HACS) e add-ons instalados e gera um
  relatório de achados de segurança para revisão humana.
url: https://github.com/diogocaseca/ha-security-auditor
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# tini do Docker como PID 1: repassa sinais e recolhe processos zumbis
# deixados pelos scanners (semgrep, trivy).
init: true

# Interface web pelo Ingress, com atalho na barra lateral.
ingress: true
ingress_port: 8099
# Verificação de saúde para o Watchdog do Supervisor: endpoint leve que só
# devolve o estado do agendador. Aceito porque vem de 172.30.32.2 (Supervisor).
watchdog: http://[HOST]:[PORT:8099]/api/status
panel_icon: mdi:shield-search
panel_title: Security Auditor
panel_admin: true

# Leitura da lista de add-ons, permissões e estatísticas (somente GET no código).
hassio_api: true
hassio_role: manager
# Publicação dos sensores sensor.security_auditor_* via API do Core.
homeassistant_api: true

# /config do Home Assistant, SOMENTE LEITURA.
map:
  - type: homeassistant_config
    read_only: true
    path: /config

# AppArmor ativo com o perfil próprio em apparmor.txt.
apparmor: true

options:
  scan_interval_hours: 24
  scan_on_start: true
  log_level: info
  github_token: ""
  report_retention: 10
  addons_scan: true
  image_scan: true
  image_scan_skip: []
  stats_interval_minutes: 5
  dns_provider: nenhum
  dns_url: ""
  dns_username: ""
  dns_password: ""
  dns_client_ips: []
  dns_verify_tls: true
  allowlist: []

schema:
  scan_interval_hours: int(0,720)
  scan_on_start: bool
  log_level: list(debug|info|warning|error)
  github_token: password?
  report_retention: int(1,100)
  addons_scan: bool
  image_scan: bool
  image_scan_skip:
    - str
  stats_interval_minutes: int(0,60)
  dns_provider: list(nenhum|adguard|pihole)
  dns_url: str?
  dns_username: str?
  dns_password: password?
  dns_client_ips:
    - str
  dns_verify_tls: bool
  allowlist:
    - component: str
      rule: str
      path: str?
      reason: str
