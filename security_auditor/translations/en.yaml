configuration:
  scan_interval_hours:
    name: Scan interval (hours)
    description: 0 disables scheduled scans; use the "Scan now" button.
  scan_on_start:
    name: Scan on start
  modo_execucao:
    name: Execution mode (overload protections)
    description: >-
      Add one or more, combined. prioridade_baixa = lowest CPU/IO priority;
      modo_leve = 1 worker, memory cap and pauses; aguardar_folga = wait for the
      system to be idle before heavy steps; horario_fixo = daily scan at the time below.
  horario_varredura:
    name: Scan time (with horario_fixo)
  memoria_minima_mb:
    name: Minimum free memory (MB, with aguardar_folga)
  carga_maxima_por_cpu:
    name: Maximum load per core (with aguardar_folga)
  log_level:
    name: Log level
  github_token:
    name: GitHub token (optional)
    description: Token with no scopes, only to raise the GitHub API rate limit. Never logged.
  report_retention:
    name: Reports kept
  addons_scan:
    name: Audit other add-ons
  image_scan:
    name: Scan add-on images (Trivy)
  image_scan_skip:
    name: Images to skip
  stats_interval_minutes:
    name: Stats collection interval (minutes)
    description: 0 disables.
  adguard_url:
    name: AdGuard Home URL (phase 3, optional)
    description: Fill AdGuard, Pi-hole or both (queries are combined). Add-on DNS goes through HA, so queries cannot be attributed to a specific add-on.
  adguard_username:
    name: AdGuard Home username
  adguard_password:
    name: AdGuard Home password
  pihole_url:
    name: Pi-hole v6 URL (phase 3, optional)
  pihole_password:
    name: Pi-hole app password
  dns_client_ips:
    name: Home Assistant IPs on the DNS server (optional)
  dns_verify_tls:
    name: Verify TLS certificate
  intervalo_dns_minutos:
    name: DNS check interval (minutes)
    description: How often the auditor re-reads the AdGuard/Pi-hole log and updates only the DNS part of the report, without scanning the components again. New DNS findings raise an alert in HA according to the minimum alert level. From 0 to 1440 minutes; default 120. With 0, DNS only runs together with the full scan.
  ia_provedor:
    name: AI for checking domains
    description: Shows the "Ask the AI" button in the DNS tab's domain table. When clicked, only the domain name is sent to the chosen provider (Gemini or Claude); nothing else about your installation leaves the add-on. Off by default. The answer is a language model's opinion and can be wrong.
  ia_chave_api:
    name: AI API key
    description: Key from Google AI Studio (Gemini) or the Claude Console (Claude). It stays in the add-on and never shows in logs or in the report. Usage is billed by the provider, to your account.
  ia_modelo:
    name: AI model (optional)
    description: Empty = the provider's default (gemini-3.5-flash-lite for Gemini, claude-opus-5-5 for Claude).
  lista_comunitaria:
    name: Community blocklist
    description: Downloads the signed list of reported components from GitHub and compares it locally. Nothing about your installation is sent.
  verificar_instalacoes:
    name: Check installs and updates
    description: Periodically checks whether an integration, frontend card or add-on was installed or updated and scans only that component right away.
  intervalo_verificacao_minutos:
    name: Install check interval (minutes)
    description: How often the auditor looks at what is installed (a light check, no file contents read; it only scans when something changed). From 1 to 60 minutes; default 2. The scan starts on the following check, once the install has finished.
  aviso_nivel_minimo:
    name: Minimum level for alerts
    description: "After checking an install or update, warns in HA (notification and the security_auditor_alerta event) when there are findings from this level up or a blocklist match. Values: critica, alta, media, baixa or desligado (off)."
  allowlist:
    name: Allowlist
    description: Exceptions per component and rule. Suppressed findings stay in the report, flagged.
