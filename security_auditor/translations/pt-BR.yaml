configuration:
  scan_interval_hours:
    name: Intervalo entre varreduras (horas)
    description: 0 desativa a varredura agendada; use o botão "Varrer agora".
  scan_on_start:
    name: Varrer ao iniciar
    description: Executa uma varredura logo que o add-on inicia.
  log_level:
    name: Nível de log
  github_token:
    name: Token do GitHub (opcional)
    description: >-
      Token sem nenhum escopo, só para aumentar o limite de requisições
      da API do GitHub. Nunca é registrado em log.
  report_retention:
    name: Relatórios mantidos
    description: Quantos relatórios anteriores guardar em /data.
  addons_scan:
    name: Auditar outros add-ons
    description: Permissões, código-fonte, imagens e tráfego dos add-ons instalados.
  image_scan:
    name: Varrer imagens dos add-ons (Trivy)
    description: >-
      Procura CVEs e segredos nas imagens, direto no registro. É a etapa mais
      demorada e usa banda e espaço em /data.
  image_scan_skip:
    name: Imagens a ignorar
    description: Slugs de add-ons cujas imagens não devem ser varridas.
  stats_interval_minutes:
    name: Intervalo de coleta de estatísticas (minutos)
    description: CPU, memória e rede dos add-ons, para detectar picos de envio. 0 desativa.
  dns_provider:
    name: Servidor DNS (Fase 3, opcional)
    description: >-
      AdGuard Home ou Pi-hole v6, para listar os domínios consultados pelo host
      do HA. O DNS de todos os add-ons passa pelo HA: não dá para saber qual
      add-on fez cada consulta.
  dns_url:
    name: URL do servidor DNS
    description: "Ex.: http://192.168.1.2:3000 (AdGuard) ou http://pi.hole (Pi-hole)."
  dns_username:
    name: Usuário (AdGuard Home)
  dns_password:
    name: Senha
    description: Senha do AdGuard Home ou senha de app do Pi-hole v6. Nunca é registrada em log.
  dns_client_ips:
    name: IPs do Home Assistant no servidor DNS (opcional)
    description: Vazio = descobrir automaticamente (IPs do host + 172.30.32.3).
  dns_verify_tls:
    name: Verificar certificado TLS
    description: Desative só se o servidor DNS usar certificado próprio em HTTPS.
  allowlist:
    name: Exceções (allowlist)
    description: >-
      Lista de exceções por componente e regra. Achados suprimidos continuam
      no relatório, marcados como suprimidos.
