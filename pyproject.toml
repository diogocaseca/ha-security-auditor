[project]
name = "ha-security-auditor-dev"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["security_auditor/app"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["security_auditor/app"]

[tool.ruff.lint]
exclude = ["tests/fixtures/**"]

[tool.ruff.lint.per-file-ignores]
# Caminhos em /tmp aqui são só texto para conferir as regras do AppArmor.
"tests/test_apparmor.py" = ["S108"]
