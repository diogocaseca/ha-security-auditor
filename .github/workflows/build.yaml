# Monta e publica as imagens do app no GitHub Container Registry (ghcr.io).
#
# - Pull request: só monta (confere que o Dockerfile funciona), sem publicar.
# - Push na main: monta amd64 e aarch64, publica com a versão do config.yaml e "latest",
#   assina com Cosign (sem chave: identidade do GitHub Actions) e junta as duas num manifesto
#   multiarquitetura (ghcr.io/diogocaseca/security-auditor).
# - Uma versão já publicada nunca é sobrescrita (skip-existing): para mudar a imagem, suba a versão.
#
# Todas as actions são fixadas por commit (não por tag), para que ninguém troque o código delas.
name: Build

on:
  pull_request:
    branches: [main]
    paths:
      - "security_auditor/**"
      - ".github/workflows/build.yaml"
  push:
    branches: [main]
    paths:
      - "security_auditor/config.yaml"
      - "security_auditor/Dockerfile"
      - "security_auditor/rootfs/**"
      - "security_auditor/app/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: security_auditor
  IMAGE_NAME: security-auditor

jobs:
  prepare:
    name: Preparar
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ler versão e arquiteturas do config.yaml
        id: info
        run: |
          cfg="${APP_DIR}/config.yaml"
          {
            echo "version=$(yq -r '.version' "$cfg")"
            echo "architectures=$(yq -o=json -I=0 '.arch' "$cfg")"
            echo "name=$(yq -r '.name' "$cfg")"
            echo "description=$(yq -r '.description' "$cfg" | tr '\n' ' ' | sed 's/ *$//')"
            echo "url=$(yq -r '.url' "$cfg")"
          } >> "$GITHUB_OUTPUT"

      - name: Montar a matriz de arquiteturas
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Imagem ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # assinatura Cosign sem chave
      packages: write # publicar no ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Montar (e publicar, na main)
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Manifesto multiarquitetura
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publicar o manifesto
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          skip-existing: ${{ needs.prepare.outputs.version }}
